plugins {
    id 'java'
    id "application"
}
sourceCompatibility = 17
targetCompatibility = 17

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.12.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.12.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.12.1'
    testImplementation 'org.junit.platform:junit-platform-engine:1.12.1'
    testImplementation 'org.junit.platform:junit-platform-runner:1.12.1'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.12.1'
    testImplementation 'org.junit.platform:junit-platform-suite-api:1.12.1'
    testImplementation 'org.junit.platform:junit-platform-suite-engine:1.12.1'
    implementation 'com.codeborne:selenide:7.14.0'
}

// https://docs.gradle.org/current/userguide/java_testing.html#sec:test_execution
test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    dependsOn clean
}

task testFuelSuite(type: Test) {
    filter {
        includeTestsMatching "selenide.tests.*"
    }
    useJUnitPlatform {
        includeTags 'Fuel'
    }
}
